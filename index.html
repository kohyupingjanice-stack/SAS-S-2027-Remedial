<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAS(S) Remedial 2027</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SAS(S) Remedial 2027</p>
          <h1>Remedial Student Access</h1>
        </div>
      </header>

      <main class="content">
        <section class="card form-card">
          <h2>Student verification</h2>
          <p class="helper-text">Enter part of the student name to search and reveal the details.</p>

          <div class="stacked-form">
            <label>
              <span>Name</span>
              <input id="nameInput" type="text" placeholder="e.g. OZER or ZHENG" />
            </label>
          </div>

          <button id="verifyBtn" type="button">Search details</button>
          <div id="statusMessage" class="status-message" aria-live="polite"></div>
        </section>

        <section id="resultCard" class="card result-card hidden">
          <h2>Student details</h2>
          <div id="resultContent"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
